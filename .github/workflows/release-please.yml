name: Release please

# Versioning lives here, decoupled from deploys. Forge manifests carry no
# version, so SemVer is tracked in package.json + git tags + CHANGELOG.md. On
# each push to main, release-please reads the Conventional Commits since the last
# v* tag and maintains a standing "chore: release X.Y.Z" PR that bumps the
# version + accumulates the changelog. Merging THAT PR tags vX.Y.Z, cuts a GitHub
# Release, commits CHANGELOG.md, attaches a CycloneDX SBOM of the production
# dependency tree to that Release, and — via the `production` job below — ships
# that tag to Forge. Nothing here publishes to npm (the package is private).
# ci.yml still owns staging, which every shippable push to main reaches
# unattended; this file owns the promotion to production.
#
# The release PR only touches package.json / package-lock.json / CHANGELOG.md, so
# it passes the required Diagram-corpus and Dependency-audit checks like any
# other PR. That same narrowness means the merge commit is shippable=false in
# ci.yml: `code` does not match, and the production-dependency fingerprint
# excludes the root package's own version (scripts/prod-deps-fingerprint.mjs),
# so the closures compare equal. staging therefore skips the release commit —
# correctly, having already deployed every commit in the batch individually.
# Production is reached from here instead, and does NOT consult `shippable`.

on:
  push:
    branches: [main]

# Top-level default is read-only so the elevated token never reaches the
# checkout or any other step (Scorecard Token-Permissions). The write scopes
# live on the release-please job below, which is the only thing that needs them.
permissions:
  contents: read

jobs:
  release-please:
    name: Maintain release PR
    runs-on: ubuntu-latest
    # release-please opens/updates its release PR and, on merge, pushes tags and
    # a GitHub Release — so it needs write on both.
    permissions:
      contents: write
      pull-requests: write
    # Most pushes to main only refresh the standing release PR, so these stay
    # empty and the sbom job below never starts. They are non-empty exactly on
    # the push that merges the release PR. With a single root package (path "."
    # in release-please-config.json) the action emits them unprefixed; a
    # monorepo would namespace them per path.
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # SHA-pinned like every action in this repo (see ci.yml).
      # Renovate bumps the pin via the trailing version comment. Config lives in
      # release-please-config.json; the last-released version in
      # .release-please-manifest.json (bootstrapped to 1.0.0, anchored by the
      # v1.0.0 tag).
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # A CycloneDX SBOM of the production dependency tree, attached to the Release
  # that was just cut. Supply-chain reviewers ask for a machine-readable
  # inventory per tagged version; `npm audit` and the Dependency Review licence
  # gate answer narrower questions and leave nothing behind.
  #
  # Why a second job rather than more steps on the one above: this needs
  # contents:write to upload an asset, but has no business holding
  # pull-requests:write, and it is where `npm ci` runs.
  sbom:
    name: Attach SBOM to release
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          # Check out the tag, not the branch head. The SBOM has to describe the
          # lockfile that was released; main may have moved on by the time this
          # job is scheduled.
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          # Same exact pin as every job in ci.yml — see the corpus job there for
          # the 22.23.x node-fetch regression this avoids.
          node-version: 22.22.3
          cache: npm
      # The generator reads each installed package's own package.json for its
      # licence, so the tree has to actually exist (see ci.yml's audit job).
      - run: npm ci
      - run: npm run sbom
      # Named for the version so a downloaded asset is still identifiable, and
      # --clobber so re-running a failed job is idempotent rather than a 422.
      - name: Upload SBOM to the release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          cp sbom.cdx.json "merfluence-${TAG#v}.cdx.json"
          gh release upload "$TAG" "merfluence-${TAG#v}.cdx.json" --clobber

  # Ship the tag that was just cut. This is the ONLY automatic route to
  # production: ci.yml deploys staging on every shippable push to main, and the
  # Marketplace version is minted here, once per release, instead of once per
  # merge.
  #
  # Why the deploy is called from this file rather than triggered by the tag or
  # the Release it just created: release-please acts as secrets.GITHUB_TOKEN
  # above, and events triggered by that token do not start workflow runs. An
  # `on: release: published` workflow would simply never fire. `release_created`
  # is the same gate the sbom job uses; it is non-empty only on the push that
  # merges the release PR.
  #
  # No `secrets: inherit`: FORGE_EMAIL/FORGE_API_TOKEN are attached to the
  # production ENVIRONMENT, and the called workflow's deploy job resolves them
  # from there. Inheriting would be a no-op that reads like a grant.
  production:
    name: Deploy the release to production
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/deploy-production.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
