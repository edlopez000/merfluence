<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Edit diagram</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: transparent;
        font-family: var(
          --ds-font-family-sans,
          ui-sans-serif,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          Roboto,
          sans-serif
        );
        color: var(--ds-text, #172b4d);
        font-size: 14px;
      }
      #root {
        height: 100%;
      }

      .panel {
        position: relative;
        display: flex;
        flex-direction: column;
        height: 100%;
        gap: 10px;
        padding: 12px;
        box-sizing: border-box;
      }
      /* The whole-panel placeholder shown while the saved config is fetched,
         before there is a form to render. Overrides the column direction above
         so the spinner sits beside its label rather than on top of it. */
      .panel.loading {
        flex-direction: row;
        align-items: center;
        justify-content: center;
        color: var(--ds-text-subtle, #44546f);
        font-size: 14px;
      }

      /* Shown while a file is dragged over the editor, so it's clear the file
         will be read and turned into a diagram here — not opened by the browser.
         pointer-events:none so it never interferes with the drag/drop itself. */
      .drop-overlay {
        position: absolute;
        inset: 6px;
        z-index: 10;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        border: 2px dashed var(--ds-border-brand, #0c66e4);
        border-radius: 8px;
        background: var(--ds-surface-overlay, #ffffff);
        pointer-events: none;
      }
      .drop-overlay-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        text-align: center;
      }
      .drop-overlay-inner strong {
        font-size: 16px;
        color: var(--ds-text, #172b4d);
      }
      .drop-overlay-inner span {
        max-width: 380px;
        font-size: 13px;
        color: var(--ds-text-subtle, #44546f);
      }

      .controls {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px;
      }
      .controls label {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        color: var(--ds-text-subtle, #44546f);
      }
      select {
        font: inherit;
        font-size: 12px;
        padding: 4px 6px;
        border-radius: 4px;
        border: 1px solid var(--ds-border-input, #8590a2);
        background: var(--ds-surface, #fff);
        color: var(--ds-text, #172b4d);
      }

      .split {
        display: grid;
        grid-template-columns: minmax(280px, 1fr) minmax(280px, 1fr);
        gap: 12px;
        flex: 1;
        min-height: 0;
      }
      @media (max-width: 720px) {
        .split {
          grid-template-columns: 1fr;
        }
      }

      .pane {
        display: flex;
        flex-direction: column;
        min-height: 0;
        border: 1px solid var(--ds-border, #dfe1e6);
        border-radius: 4px;
        overflow: hidden;
      }
      .pane-title {
        padding: 6px 10px;
        font-size: 11px;
        text-transform: none;
        color: var(--ds-text-subtlest, #626f86);
        border-bottom: 1px solid var(--ds-border, #dfe1e6);
        background: var(--ds-surface-sunken, #f7f8f9);
      }
      .pane-title .hint {
        opacity: 0.8;
      }
      /* The way out of the source editor's Tab trap. Not shown until Tab has
         actually been swallowed (see the exit hint in src/config/main.tsx), so
         it answers a question the user has rather than sitting in the chrome for
         everyone who never presses Tab. Hidden the sr-only way rather than with
         display: none, because it is the editor's aria-describedby target and
         has to stay in the accessibility tree the whole time — that is how a
         screen-reader user is advised (WCAG 2.1 SC 2.1.2). */
      .pane-title .exit-hint {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }
      .pane-title .exit-hint.shown {
        position: static;
        width: auto;
        height: auto;
        overflow: visible;
        clip-path: none;
      }

      .editor {
        flex: 1;
        min-height: 0;
        overflow: auto;
      }
      .editor .cm-editor {
        height: 100%;
      }
      .editor .cm-scroller {
        font-family: var(--ds-font-family-code, ui-monospace, monospace);
        font-size: 13px;
      }

      /* Mermaid token colours, consumed by mermaidHighlightStyle. Each is an
         Atlassian design token with a literal fallback for the case where the
         host hasn't injected --ds-* yet (enableTheme resolves asynchronously,
         so the first paint can land before the tokens do) — hence a separate
         dark set rather than one set of light literals that would be unreadable
         on the dark editor surface. The .editor-dark class comes from the
         Editor component's own `dark` flag; see mermaid-lang.ts for why not
         CodeMirror's theme class or the host's data-color-mode. */
      .editor {
        --mf-tok-keyword: var(--ds-text-accent-blue, #0055cc);
        --mf-tok-comment: var(--ds-text-subtlest, #626f86);
        --mf-tok-string: var(--ds-text-accent-green, #216e4e);
        --mf-tok-operator: var(--ds-text-accent-magenta, #943d73);
        --mf-tok-meta: var(--ds-text-accent-purple, #5e4db2);
        --mf-tok-number: var(--ds-text-accent-orange, #a54800);
        --mf-tok-variable: var(--ds-text, #172b4d);
      }
      .editor.editor-dark {
        --mf-tok-keyword: var(--ds-text-accent-blue, #579dff);
        --mf-tok-comment: var(--ds-text-subtlest, #9fadbc);
        --mf-tok-string: var(--ds-text-accent-green, #7ee2b8);
        --mf-tok-operator: var(--ds-text-accent-magenta, #f797d2);
        --mf-tok-meta: var(--ds-text-accent-purple, #b8acf6);
        --mf-tok-number: var(--ds-text-accent-orange, #fec195);
        --mf-tok-variable: var(--ds-text, #c7d1db);
      }

      /* overflow: hidden, not auto — the shared Stage below clips and pans
         instead of the pane scrolling, so a wheel or a drag reaches the diagram
         rather than the scrollbar. */
      .preview {
        /* Positioned so .preview-busy anchors to the preview pane. Without
           this the nearest positioned ancestor is .panel and the chip lands in
           the corner of the whole modal, over the source editor. */
        position: relative;
        flex: 1;
        min-height: 0;
        overflow: hidden;
        padding: 12px;
        display: flex;
        align-items: stretch;
        justify-content: center;
      }

      /* Shown while a re-render is in flight. It overlays rather than replaces
         because the diagram underneath stays live: the previous render, and
         with it the reader's pan/zoom position, must survive a keystroke or a
         template switch. Bottom-right, because top-right is the Stage
         toolbar's corner (see .toolbar below). pointer-events:none so it can
         never swallow a pan drag that starts under it. */
      .preview-busy {
        position: absolute;
        right: 8px;
        bottom: 8px;
        z-index: 1;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 8px;
        border: 1px solid var(--ds-border, #dfe1e6);
        border-radius: 4px;
        background: var(--ds-surface-overlay, #fff);
        color: var(--ds-text-subtle, #44546f);
        font-size: 12px;
        line-height: 1.4;
        pointer-events: none;
      }
      /* A much longer delay than the shared .reveal below, because this chip is
         the one case where the wait costs nothing: the previous diagram is
         still on screen and still interactive, so saying nothing for a while is
         strictly better than narrating work the user did not notice.
         Measured in Chromium on warm engines, a template switch renders in
         86-112ms (median 95), and a cold-ish one in 121-175ms. A threshold
         inside that band is the worst setting available — it makes the chip
         appear on some renders and not others, and intermittent flicker reads
         as jank. 400ms clears the whole band, leaving the chip for the case it
         was built for: an engine chunk still coming down over a real network. */
      .preview-busy.reveal {
        animation-delay: 400ms;
      }

      /* ---------------------------------------------------------------- */
      /* Busy indicators — duplicated verbatim in src/view/index.html.     */
      /* Same reason as the Stage block below: the two shells share no      */
      /* stylesheet. Keep the copies in step; test/shell-css.test.js checks.*/
      /* ---------------------------------------------------------------- */

      /* Animating `transform` (rather than, say, a border sweep) keeps this on
         the compositor, so it goes on turning through a Mermaid render instead
         of freezing on the frame the main thread stopped at — a spinner that
         stalls during the wait it exists to cover is worse than none. */
      .spinner {
        flex: none;
        width: 10px;
        height: 10px;
        border: 2px solid var(--ds-border, #dfe1e6);
        border-top-color: var(--ds-text-subtle, #44546f);
        border-radius: 50%;
        animation: spin 700ms linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* A busy indicator mounts the moment work starts and unmounts when it
         ends, so work that finishes inside the delay below never paints at
         all. That is the whole anti-flash mechanism: no JS timer, no extra
         state, no bundle cost. The fade matters as much as the delay — work
         landing just past it would otherwise flash at full opacity for one
         frame, where the ramp puts it in single-digit percent and it reads as
         nothing.
         150ms is calibrated for the whole-surface placeholders that use this
         class bare (the editor mount, the reader's first load): they are the
         only thing on screen, so the delay buys one un-flashed fast path and
         anything longer is just a blank panel. Indicators that overlay content
         which is still usable want a much longer delay and set their own — see
         .preview-busy above.
         Deliberately NOT `opacity: 0` + `forwards`: the resting value is the
         visible one and the delay is carried by a `backwards` fill, so
         anything that stops the animation — a reduced-motion rule, a browser
         that skips it — falls back to "appears immediately" rather than
         "never appears". An indicator that can silently vanish for a subset of
         users is worse than one that occasionally shows early. */
      .reveal {
        opacity: 1;
        animation: mf-reveal 160ms ease-out 150ms backwards;
      }
      @keyframes mf-reveal {
        from {
          opacity: 0;
        }
      }

      /* ---------------------------------------------------------------- */
      /* Shared Stage (src/components/Stage.tsx)                          */
      /* ---------------------------------------------------------------- */
      /* The reader's stage rules, copied from src/view/index.html so the same
         component looks and sizes the same in both bundles. Duplicated rather
         than extracted: the two Vite bundles have separate HTML shells, and a
         shared-CSS build step to save forty lines would cost more than it saves.
         Keep the two copies in step when either changes.
         Deliberately NOT copied: the reader's html/body/.root width rules, which
         exist only to stop an oversized diagram stretching its auto-sizing
         iframe. The modal is a fixed box and the pane below is already definite,
         so they would mean nothing here. */

      /* The stage fills the pane so there is a large surface to drag on and a
         definite box to clip against, rather than hugging the diagram the way
         the reader's does inside a page column. */
      .preview .root {
        position: relative;
        display: flex;
        flex: 1;
        min-width: 0;
      }
      .preview .stage {
        flex: 1;
        min-width: 0;
      }

      .stage {
        /* Containing block for the two controls that float over the diagram (the
           keyboard hint and the fullscreen exit). */
        position: relative;
        overflow: hidden;
        cursor: grab;
        /* Dragging pans the diagram; without this the drag selects the SVG's
           text labels instead. The source is right there in the other pane. */
        user-select: none;
        -webkit-user-select: none;
      }
      .stage.dragging {
        cursor: grabbing;
      }
      /* The stage is focusable (it takes the arrow/zoom keys), so it needs a
         visible focus indicator. Inset offset so the ring is not clipped by the
         pane's overflow: hidden. */
      .stage:focus-visible {
        outline: 2px solid var(--ds-border-focused, #388bff);
        outline-offset: -2px;
      }
      /* The pan layer shrinks to the diagram's width and centres itself, so a
         diagram narrower than the pane sits in the middle instead of hugging the
         left. max-width keeps Mermaid's shrink-to-fit. */
      .pan {
        width: fit-content;
        max-width: 100%;
        margin: 0 auto;
        /* Deliberately NOT will-change: transform — see the matching note in
           src/view/index.html. Promoting this layer makes a zoomed diagram
           magnify a cached bitmap instead of re-rendering the vector, and on a
           large diagram it stays blurry for good. */
      }
      /* width carries the viewBox's own width, set by Stage — without it
         Mermaid's width="100%" has nothing to resolve against inside .pan and
         every wide diagram lays out at 300px (issue #141). max-width is
         !important because Mermaid's inline max-width outranks a stylesheet
         rule, and it is what shrinks a wide diagram to the pane. See the fuller
         note on the same rules in src/view/index.html. */
      .stage svg {
        display: block;
        width: var(--diagram-width, 100%);
        max-width: 100% !important;
        height: auto;
      }
      /* "Keep full width", which is a class switch and nothing else — the SVG
         markup is the same in both modes, so these two rules are the whole of
         it. */
      .stage.no-shrink .pan {
        max-width: none;
      }
      .stage.no-shrink svg {
        max-width: none !important;
      }

      /* An explicit height chosen in the Size dropdown (see SIZE_PRESETS in
         src/lib/sizing.ts). Same rules as the reader's, so what the author sees
         here is what the page renders. */
      .stage.sized:not(:fullscreen):not(.maximized) .pan {
        max-width: none;
      }
      /* !important beats the inline max-width/width Mermaid writes onto the SVG,
         and the --diagram-width rule above. */
      .stage.sized:not(:fullscreen):not(.maximized) svg {
        height: var(--diagram-height) !important;
        width: auto !important;
        max-width: none !important;
      }

      /* Maximize. The Forge config modal's iframe may not carry
         allow="fullscreen", in which case requestFullscreen rejects and Stage
         falls back to the .maximized class — pinned with CSS to this iframe's
         viewport, which is the modal. Both are styled here so whichever the host
         grants looks the same. */
      .stage:fullscreen,
      .stage.maximized {
        background: var(--ds-surface, #fff);
        padding: 24px;
        box-sizing: border-box;
      }
      .stage.maximized {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
      }

      /* The keyboard shortcuts, shown only while the preview holds keyboard
         focus — the one moment they're useful. pointer-events: none so they
         never swallow a drag that crosses them. */
      .keys {
        display: none;
        position: absolute;
        bottom: 8px;
        left: 50%;
        transform: translateX(-50%);
        max-width: calc(100% - 16px);
        z-index: 1;
        font-size: 11px;
        line-height: 1.3;
        color: var(--ds-text-subtlest, #626f86);
        background: var(--ds-surface-overlay, #fff);
        border: 1px solid var(--ds-border, #dfe1e6);
        border-radius: 4px;
        padding: 3px 8px;
        pointer-events: none;
      }
      /* F maximizes and then leaves, so the chip says one or the other. */
      .keys-fs {
        display: none;
      }
      .stage:fullscreen .keys-inline,
      .stage.maximized .keys-inline {
        display: none;
      }
      .stage:fullscreen .keys-fs,
      .stage.maximized .keys-fs {
        display: inline;
      }
      .root:has(:focus-visible) .keys,
      /* Always when maximized: the toolbar is hidden there, so the keys are the
         only zoom/reset controls left. */
      .stage:fullscreen .keys,
      .stage.maximized .keys {
        display: block;
      }

      /* Exit control, only visible when maximized (the toolbar is hidden there). */
      .fs-exit {
        display: none;
      }
      .stage:fullscreen .fs-exit,
      .stage.maximized .fs-exit {
        display: inline-flex;
        align-items: center;
        position: absolute;
        top: 16px;
        right: 16px;
        z-index: 1;
        appearance: none;
        border: 1px solid var(--ds-border, #dfe1e6);
        border-radius: 6px;
        /* background-color (not the `background` shorthand) so the hover overlay
           below layers ON TOP of this opaque fill. The button floats directly
           over the diagram, so its fill must stay opaque. */
        background-color: var(--ds-surface-overlay, #fff);
        color: var(--ds-text, #172b4d);
        font: inherit;
        font-size: 13px;
        line-height: 1;
        padding: 8px 12px;
        cursor: pointer;
      }
      .stage:fullscreen .fs-exit:hover,
      .stage.maximized .fs-exit:hover {
        background-image: linear-gradient(
          var(--ds-background-neutral-subtle-hovered, #091e420f),
          var(--ds-background-neutral-subtle-hovered, #091e420f)
        );
      }
      .stage:fullscreen .fs-exit:focus-visible,
      .stage.maximized .fs-exit:focus-visible {
        outline: 2px solid var(--ds-border-focused, #388bff);
        outline-offset: 1px;
      }

      /* The zoom / fit / maximize toolbar. No Copy source or Export here — those
         are reader actions, injected into Stage by the view bundle only. */
      .toolbar {
        position: absolute;
        top: 4px;
        right: 4px;
        display: flex;
        gap: 2px;
        padding: 2px;
        border-radius: 6px;
        background: var(--ds-surface-overlay, #fff);
        border: 1px solid var(--ds-border, #dfe1e6);
        opacity: 0;
        transition: opacity 120ms ease-in;
      }
      .root:hover .toolbar,
      .toolbar:focus-within,
      /* A keyboard user focusing the diagram has no pointer to hover with, so
         reveal the controls for them too. */
      .root:has(.stage:focus-visible) .toolbar,
      /* A failure message lives in the toolbar; hiding the toolbar the moment the
         pointer leaves would take the message with it. */
      .toolbar:has(.status) {
        opacity: 1;
      }

      .toolbar button {
        appearance: none;
        border: 0;
        border-radius: 4px;
        background: transparent;
        color: var(--ds-text-subtle, #44546f);
        font: inherit;
        font-size: 12px;
        line-height: 1;
        padding: 6px 8px;
        cursor: pointer;
      }
      .toolbar button:hover {
        background: var(--ds-background-neutral-subtle-hovered, #f1f2f4);
      }
      .toolbar button:focus-visible {
        outline: 2px solid var(--ds-border-focused, #388bff);
        outline-offset: 1px;
      }
      /* The zoom percentage doubles as the "reset view" control (click to reset
         zoom + pan). It inherits .toolbar button styling, including hover. */
      .toolbar .zoom-level {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 6px 6px;
        font-variant-numeric: tabular-nums;
        /* 5ch, not 4: a heavily shrunk diagram now zooms past 999%, and the
           readout is the raw transform factor, so the toolbar would reflow the
           moment it gained a digit. */
        min-width: 5ch;
      }

      /* A failure, shown for a few seconds. Absolutely positioned below the
         toolbar so a long message never stretches the button row. */
      .toolbar .status {
        position: absolute;
        top: 100%;
        right: 0;
        margin-top: 4px;
        max-width: 90vw;
        padding: 4px 8px;
        border: 1px solid var(--ds-border-danger, #c9372c);
        border-radius: 4px;
        background: var(--ds-background-danger, #ffedeb);
        color: var(--ds-text-danger, #ae2e24);
        font-size: 12px;
        line-height: 1.4;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      @media (prefers-reduced-motion: reduce) {
        .toolbar {
          transition: none;
        }
        /* The ring goes static; the "Rendering…" text next to it is what
           actually carries the meaning, so nothing is lost by stopping it. */
        .spinner {
          animation: none;
        }
        /* Zeroing the duration, not `animation: none`. The delay and the
           `backwards` fill are load-bearing — killing the animation outright
           would drop the anti-flash delay here, and would hide the indicator
           entirely under any future rule with a zero resting opacity. This
           removes the fade and keeps the timing. */
        .reveal {
          animation-duration: 1ms;
        }
      }

      .diagnostic {
        border-left: 3px solid var(--ds-border-danger, #c9372c);
        background: var(--ds-background-danger, #ffedeb);
        color: var(--ds-text-danger, #ae2e24);
        padding: 8px 10px;
        font-size: 12px;
      }
      .diagnostic code {
        font-family: var(--ds-font-family-code, ui-monospace, monospace);
      }
      .diagnostic.ok {
        border-left-color: var(--ds-border-success, #22a06b);
        background: var(--ds-background-success, #dcfff1);
        color: var(--ds-text-success, #216e4e);
      }

      .actions {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
      }
      button {
        font: inherit;
        font-size: 13px;
        padding: 6px 12px;
        border-radius: 4px;
        border: 0;
        cursor: pointer;
        background: var(--ds-background-neutral, #091e420f);
        color: var(--ds-text, #172b4d);
      }
      button.primary {
        background: var(--ds-background-brand-bold, #0c66e4);
        color: var(--ds-text-inverse, #fff);
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      button:focus-visible {
        outline: 2px solid var(--ds-border-focused, #388bff);
        outline-offset: 1px;
      }

      .cm-errorLine {
        background: var(--ds-background-danger, #ffedeb);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
