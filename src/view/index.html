<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Merfluence</title>
    <style>
      /* The macro is exactly as wide as its column, never wider. A diagram that
         does not fit is clipped by .stage's overflow: hidden and reached by
         panning — the alternative, letting the content stretch the body, grows
         the Forge iframe until Confluence scrolls the whole macro sideways and
         carries the toolbar (anchored to .root's right edge) and the version
         stamp out of view.

         This is also what gives .stage a definite width, without which its
         overflow: hidden has nothing to clip against and the diagram's own width
         bubbles back up. Declared in a <style> tag, not a style="" attribute, so
         this alone would not require the unsafe-inline permission — Mermaid's
         own output is what requires it. */
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        background: transparent;
        font-family: var(
          --ds-font-family-sans,
          ui-sans-serif,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          Roboto,
          sans-serif
        );
        color: var(--ds-text, #172b4d);
      }

      .root {
        position: relative;
        width: 100%;
      }

      .stage {
        /* Containing block for the two controls that float over the diagram (the
           keyboard hint and the fullscreen exit). It has to be the stage rather
           than .root, because in fullscreen the stage IS the screen while .root
           still has its page-column box. */
        position: relative;
        overflow: hidden;
        cursor: grab;
        /* Dragging pans the diagram; without this the drag selects the SVG's
           text labels instead. Source text is available via "Copy source". */
        user-select: none;
        -webkit-user-select: none;
      }
      .stage.dragging {
        cursor: grabbing;
      }
      /* The stage is focusable (it takes the arrow/zoom keys), so it needs a
         visible focus indicator. Inset offset, unlike the buttons': the stage
         spans the full macro column, so an outset ring would be drawn beyond the
         iframe's visible box and clipped away on at least one edge. */
      .stage:focus-visible {
        outline: 2px solid var(--ds-border-focused, #388bff);
        outline-offset: -2px;
      }
      /* The pan layer shrinks to the diagram's width and centres itself in the
         macro column, so a diagram narrower than the column sits in the middle
         instead of hugging the left. max-width keeps Mermaid's shrink-to-fit. */
      .pan {
        width: fit-content;
        max-width: 100%;
        margin: 0 auto;
        /* Deliberately NOT will-change: transform (or any other compositor
           promotion). It looks right — this layer's transform changes every
           frame of a gesture — but promoting it rasterizes the diagram once
           and lets the compositor scale that bitmap, so zooming magnifies
           pixels instead of re-rendering the vector. On a large diagram the
           raster it would need at high zoom is past the GPU's texture limit,
           so the layer is rasterized at a capped scale and stays permanently
           blurry rather than sharpening when the gesture ends. Re-rasterizing
           per frame IS the crispness; an SVG that renders as a fuzzy bitmap
           gives up the reason to ship SVG at all. */
      }
      /* width is the fix for issue #141. Mermaid writes width="100%" and keeps
         the real width only in an inline max-width — and a percentage width has
         nothing to resolve against inside .pan's shrink-to-fit box, so the SVG
         fell back to the replaced-element default of 300x150 and the column
         width never reached the diagram. The variable carries the viewBox's
         width, which Stage sets once the SVG lands (see
         src/components/Stage.tsx); with a real width in hand, .pan's fit-content
         resolves to the diagram's own width and max-width below clamps it to the
         column. The 100% fallback is the old behaviour, for an SVG with no
         viewBox to measure.

         !important because that inline max-width outranks any stylesheet rule,
         and it is the clamp that shrinks a wide diagram to the column — without
         it the default mode would lay out at full width and clip, i.e. behave
         like no-shrink below. Same reason the .sized rules further down need it.

         These rules are why width is settled entirely here: they override the
         SVG's own width/max-width in every mode, whichever shape Mermaid wrote
         them in, so a cache written by an older build lays out the same as a
         fresh render. */
      .stage svg {
        display: block;
        width: var(--diagram-width, 100%);
        max-width: 100% !important;
        height: auto;
      }
      /* "Keep full width": lay the diagram out at its own width and let
         .stage's overflow: hidden clip it, panning to reach the rest. These two
         rules are the entire mechanism — the markup is identical to the default
         mode's, so the class is what makes the difference. */
      .stage.no-shrink .pan {
        max-width: none;
      }
      /* !important only to beat the rule above, which now carries it. Mermaid's
         own inline max-width sits at the diagram's own width, which is where
         --diagram-width puts it anyway, so that one never binds either way. */
      .stage.no-shrink svg {
        max-width: none !important;
      }

      /* An explicit height chosen in the editor's Size dropdown (see SIZE_PRESETS
         in src/lib/sizing.js). The SVG scales to --diagram-height, keeping the
         aspect ratio from its viewBox; the .pan drops its column clamp so a
         now-wider diagram isn't squashed, and the existing pan/zoom reaches
         whatever overflows. Unset — the Natural preset — falls back to the
         natural fit rules above.

         The :not() pair because the preset sizes the macro within a page column,
         which means nothing once the stage IS the screen — it would strand a
         Small diagram as a 320px strip. Excluding the rules entirely is
         deliberate: maximized then reuses the natural rules above verbatim,
         rather than layering overrides that have to win an !important fight and
         reason about which of width/height stays definite. */
      .stage.sized:not(:fullscreen):not(.maximized) .pan {
        max-width: none;
      }
      /* !important beats the inline max-width/width Mermaid writes onto the SVG,
         and the --diagram-width rule above. width:auto is only safe BECAUSE
         height is definite here: Mermaid emits width="100%" and no height
         attribute, so the viewBox ratio needs exactly one of the two fixed to
         resolve. Setting both to auto leaves the SVG with no size at all (a
         blank diagram). */
      .stage.sized:not(:fullscreen):not(.maximized) svg {
        height: var(--diagram-height) !important;
        width: auto !important;
        max-width: none !important;
      }

      /* Fullscreen keeps the same interactive pan/zoom as the inline view — it's
         just a larger, backdropped stage, so the live transform on .pan stays in
         effect and you can zoom (plain wheel here) and drag around. On enter the
         fullscreenchange handler fits the diagram to the screen and centres it
         (see fitView in src/lib/zoom.js); on exit it restores the inline view.
         Centring is the JS's job, not this rule's: the fit zoom and the centring
         offset are one calculation, so splitting them across CSS and JS would
         mean measuring around whatever CSS had already done. Exit with Esc.

         .maximized is the fallback for a host that refuses real fullscreen (see
         enterFallback in src/components/Stage.tsx) — same look, pinned with CSS.
         It is grouped onto every :fullscreen rule rather than replacing them, so
         a natively-fullscreen stage is styled by the pseudo-class the instant
         the browser applies it, with no unstyled frame waiting on React to paint
         a class. */
      .stage:fullscreen,
      .stage.maximized {
        background: var(--ds-surface, #fff);
        padding: 24px;
        box-sizing: border-box;
      }
      /* Only the fallback needs pinning; :fullscreen is already the viewport.
         Note this pins to the *iframe's* viewport, which is why the fallback is
         useful in the config modal (its iframe fills the modal) and never
         reached in the reader macro (whose iframe is macro-height, and where
         native fullscreen is granted anyway). */
      .stage.maximized {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
      }

      /* The keyboard shortcuts, shown only while the macro holds keyboard focus —
         the one moment they're useful, and never in anyone's way otherwise. The
         :has() covers the toolbar as well as the stage, since the shortcuts work
         from either; :focus-visible keeps it away from a mouse user who just
         clicked a button. pointer-events: none so it never swallows a drag that
         crosses it. */
      .keys {
        display: none;
        position: absolute;
        bottom: 8px;
        left: 50%;
        transform: translateX(-50%);
        max-width: calc(100% - 16px);
        z-index: 1;
        font-size: 11px;
        line-height: 1.3;
        color: var(--ds-text-subtlest, #626f86);
        background: var(--ds-surface-overlay, #fff);
        border: 1px solid var(--ds-border, #dfe1e6);
        border-radius: 4px;
        padding: 3px 8px;
        pointer-events: none;
      }
      /* F enters full screen inline and leaves it once you're there, so the chip
         says one or the other, never both. */
      .keys-fs {
        display: none;
      }
      .stage:fullscreen .keys-inline,
      .stage.maximized .keys-inline {
        display: none;
      }
      .stage:fullscreen .keys-fs,
      .stage.maximized .keys-fs {
        display: inline;
      }
      .root:has(:focus-visible) .keys,
      /* Always when maximized: the toolbar is hidden there, so the keys are the
         only zoom/reset controls left — including for someone who arrived by
         mouse and so never triggered :focus-visible. */
      .stage:fullscreen .keys,
      .stage.maximized .keys {
        display: block;
      }

      /* Exit control, only visible when maximized (the toolbar is hidden there). */
      .fs-exit {
        display: none;
      }
      .stage:fullscreen .fs-exit,
      .stage.maximized .fs-exit {
        display: inline-flex;
        align-items: center;
        position: absolute;
        top: 16px;
        right: 16px;
        z-index: 1;
        appearance: none;
        border: 1px solid var(--ds-border, #dfe1e6);
        border-radius: 6px;
        /* background-color (not the `background` shorthand) so the hover overlay
           below layers ON TOP of this opaque fill. The button floats directly
           over the diagram, so its fill must stay opaque. */
        background-color: var(--ds-surface-overlay, #fff);
        color: var(--ds-text, #172b4d);
        font: inherit;
        font-size: 13px;
        line-height: 1;
        padding: 8px 12px;
        cursor: pointer;
      }
      /* Layer the (often translucent) subtle-hover token as a background-image
         over the opaque background-color, rather than replacing it — otherwise
         the diagram shows through on hover. */
      .stage:fullscreen .fs-exit:hover,
      .stage.maximized .fs-exit:hover {
        background-image: linear-gradient(
          var(--ds-background-neutral-subtle-hovered, #091e420f),
          var(--ds-background-neutral-subtle-hovered, #091e420f)
        );
      }
      .stage:fullscreen .fs-exit:focus-visible,
      .stage.maximized .fs-exit:focus-visible {
        outline: 2px solid var(--ds-border-focused, #388bff);
        outline-offset: 1px;
      }

      .toolbar {
        position: absolute;
        top: 4px;
        right: 4px;
        display: flex;
        gap: 2px;
        padding: 2px;
        border-radius: 6px;
        background: var(--ds-surface-overlay, #fff);
        border: 1px solid var(--ds-border, #dfe1e6);
        opacity: 0;
        transition: opacity 120ms ease-in;
      }
      .root:hover .toolbar,
      .toolbar:focus-within,
      /* A keyboard user focusing the diagram has no pointer to hover with, so
         reveal the controls for them too. */
      .root:has(.stage:focus-visible) .toolbar,
      /* A failure message lives in the toolbar; hiding the toolbar the moment the
         pointer leaves would take the message with it. */
      .toolbar:has(.status),
      /* Same reasoning for an open export menu, which also holds document height
         open below the macro when the iframe is too short for it (see
         menu-placement.js) — space reserved for a popup the pointer had just
         faded out would be space held for nothing. :focus-within usually covers
         this, since clicking the trigger focuses it, but not once focus has
         moved on. */
      .toolbar:has(.export-menu) {
        opacity: 1;
      }

      .toolbar button {
        appearance: none;
        border: 0;
        border-radius: 4px;
        background: transparent;
        color: var(--ds-text-subtle, #44546f);
        font: inherit;
        font-size: 12px;
        line-height: 1;
        padding: 6px 8px;
        cursor: pointer;
      }
      .toolbar button:hover {
        background: var(--ds-background-neutral-subtle-hovered, #f1f2f4);
      }
      .toolbar button:focus-visible {
        outline: 2px solid var(--ds-border-focused, #388bff);
        outline-offset: 1px;
      }

      /* A copy/export failure, shown for a few seconds. Absolutely positioned
         below the toolbar so a long message never stretches the button row, and
         nowrap so it stays one line; it reuses the danger tokens from .message
         .error, which resolve in both colour modes. */
      .toolbar .status {
        position: absolute;
        top: 100%;
        right: 0;
        margin-top: 4px;
        max-width: 90vw;
        padding: 4px 8px;
        border: 1px solid var(--ds-border-danger, #c9372c);
        border-radius: 4px;
        background: var(--ds-background-danger, #ffedeb);
        color: var(--ds-text-danger, #ae2e24);
        font-size: 12px;
        line-height: 1.4;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      /* The in-progress variant of the same chip: neutral rather than danger,
         with the spinner beside the text. Deliberately the same .status class —
         that is what the `.toolbar:has(.status)` rule above keys on, so the
         toolbar stays on screen for the whole export instead of fading away the
         moment the pointer leaves and running invisibly. */
      .toolbar .status.busy {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        border-color: var(--ds-border, #dfe1e6);
        background: var(--ds-surface-overlay, #fff);
        color: var(--ds-text-subtle, #44546f);
      }
      /* Animating `transform` (rather than, say, a border sweep) keeps this on
         the compositor, so it goes on turning through the rasterize and the PNG
         encode instead of freezing on the frame the main thread stopped at — a
         spinner that stalls during the wait it exists to cover is worse than
         none. This is the opposite call from .pan above, and for the opposite
         reason: nothing here needs to stay sharp under a live scale. */
      .spinner {
        flex: none;
        width: 10px;
        height: 10px;
        border: 2px solid var(--ds-border, #dfe1e6);
        border-top-color: var(--ds-text-subtle, #44546f);
        border-radius: 50%;
        animation: spin 700ms linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* ---------------------------------------------------------------- */
      /* Delayed reveal for busy indicators                                */
      /* Duplicated verbatim in src/config/index.html — the two shells      */
      /* share no stylesheet (see the Stage block below). Keep them in step.*/
      /* ---------------------------------------------------------------- */

      /* A busy indicator mounts the moment work starts and unmounts when it
         ends, so work that finishes inside the delay below never paints at
         all. That is the whole anti-flash mechanism: no JS timer, no extra
         state, no bundle cost. The fade matters as much as the delay — work
         landing just past it would otherwise flash at full opacity for one
         frame, where the ramp puts it in single-digit percent and it reads as
         nothing.
         150ms is calibrated for the whole-surface placeholders that use this
         class bare (the editor mount, the reader's first load): they are the
         only thing on screen, so the delay buys one un-flashed fast path and
         anything longer is just a blank panel. Indicators that overlay content
         which is still usable want a much longer delay and set their own — see
         .preview-busy in src/config/index.html.
         Deliberately NOT `opacity: 0` + `forwards`: the resting value is the
         visible one and the delay is carried by a `backwards` fill, so
         anything that stops the animation — a reduced-motion rule, a browser
         that skips it — falls back to "appears immediately" rather than
         "never appears". An indicator that can silently vanish for a subset of
         users is worse than one that occasionally shows early. */
      .reveal {
        opacity: 1;
        animation: mf-reveal 160ms ease-out 150ms backwards;
      }
      @keyframes mf-reveal {
        from {
          opacity: 0;
        }
      }

      /* Export is a button that opens a small menu of formats (PNG / SVG),
         replacing the two separate buttons. The menu is absolutely positioned so
         it drops below without changing the toolbar's height.

         `top` here is the resting placement, used until the menu has been
         measured; when the macro's iframe is too short to paint a menu hanging
         below the toolbar, main.tsx overrides it with an inline offset that
         slides the menu back inside (see src/lib/menu-placement.ts). Which is
         why nothing here may set `bottom` — an inline `top` cannot win against a
         rule that pins the other edge. */
      .export {
        position: relative;
        display: flex;
      }
      .export-menu {
        position: absolute;
        top: calc(100% + 4px);
        right: 0;
        z-index: 2;
        display: flex;
        flex-direction: column;
        min-width: 100%;
        padding: 2px;
        border-radius: 6px;
        background: var(--ds-surface-overlay, #fff);
        border: 1px solid var(--ds-border, #dfe1e6);
        box-shadow: var(--ds-shadow-overlay, 0 4px 8px rgba(9, 30, 66, 0.25));
      }
      /* The transparency toggle is a modifier, not an action, so a rule sets it
         apart from the three things above it that actually do something. */
      .export-menu .option {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-top: 2px;
        padding-top: 8px;
        border-top: 1px solid var(--ds-border, #dfe1e6);
      }
      /* Reserve the tick's width in both states, so checking the box does not
         shift its label sideways. */
      .export-menu .check {
        display: inline-block;
        width: 1em;
      }
      .export-menu button {
        justify-content: flex-start;
        text-align: left;
        /* The menu is absolutely positioned, so its shrink-to-fit width is
           capped by the containing block — .export, which is only as wide as the
           "Export ▾" trigger. Short labels fit inside that by luck; "PNG (with
           background)" wraps to two lines without this. Absolutely positioned
           boxes are allowed to be wider than their containing block, so nowrap
           lets the menu take its max-content width and grow leftward from
           right: 0. */
        white-space: nowrap;
      }
      /* The zoom percentage doubles as the "reset view" control (click to reset
         zoom + pan). It inherits .toolbar button styling, including hover. */
      .toolbar .zoom-level {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 6px 6px;
        font-variant-numeric: tabular-nums;
        /* 5ch, not 4: a heavily shrunk diagram now zooms past 999%, and the
           readout is the raw transform factor, so the toolbar would reflow the
           moment it gained a digit. */
        min-width: 5ch;
      }

      /* Version stamp: overlaid bottom-left and revealed on hover, like the
         toolbar, so it's there for bug reports without cluttering every diagram.
         Absolute (not in flow) so it reserves no empty line; pointer-events none
         so it never swallows a drag that starts over it. */
      .meta {
        position: absolute;
        bottom: 4px;
        left: 4px;
        font-size: 11px;
        line-height: 1;
        color: var(--ds-text-subtlest, #626f86);
        background: var(--ds-surface-overlay, #fff);
        border: 1px solid var(--ds-border, #dfe1e6);
        border-radius: 4px;
        padding: 3px 6px;
        opacity: 0;
        transition: opacity 120ms ease-in;
        pointer-events: none;
      }
      .root:hover .meta,
      .toolbar:focus-within ~ .meta,
      .root:has(.stage:focus-visible) .meta {
        opacity: 1;
      }

      .message {
        padding: 12px 14px;
        border-radius: 4px;
        font-size: 14px;
        line-height: 1.5;
      }
      .message.empty {
        border: 1px dashed var(--ds-border, #dfe1e6);
        color: var(--ds-text-subtle, #44546f);
      }
      /* The working variant: the spinner sits inline with the text rather than
         above it, so the box keeps the single-line height the plain message
         already had and nothing shifts when the diagram lands. */
      .message.busy {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .message.error {
        border-left: 3px solid var(--ds-border-danger, #c9372c);
        border-radius: 0;
        background: var(--ds-background-danger, #ffedeb);
        color: var(--ds-text-danger, #ae2e24);
      }
      .message pre {
        margin: 6px 0 0;
        font-family: var(--ds-font-family-code, ui-monospace, monospace);
        font-size: 12px;
        white-space: pre-wrap;
      }

      @media (prefers-reduced-motion: reduce) {
        .toolbar,
        .meta {
          transition: none;
        }
        /* The ring goes static; the "Exporting…" text next to it is what
           actually carries the meaning, so nothing is lost by stopping it. */
        .spinner {
          animation: none;
        }
        /* Zeroing the duration, not `animation: none`. The delay and the
           `backwards` fill are load-bearing — killing the animation outright
           would drop the anti-flash delay here, and would hide the indicator
           entirely under any future rule with a zero resting opacity. This
           removes the fade and keeps the timing. */
        .reveal {
          animation-duration: 1ms;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
