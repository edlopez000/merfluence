<svg xmlns="http://www.w3.org/2000/svg" class="pele pele-flowchart" viewBox="0 0 557 64" width="557" height="64" style="--pele-bg:#ffffff;--pele-fg:#172b4d;--pele-muted:#626f86;--pele-line:#44546f;--pele-surface:#f7f8f9;--pele-surface-alt:#f1f2f4;--pele-border:#8590a2;--pele-accent:#0c66e4;--_bg:var(--pele-bg,#fff);--_fg:var(--pele-fg,#1f1f1f);--_m:var(--pele-muted,#6e6e6e);--_l:var(--pele-line,#1f1f1f);--_s:var(--pele-surface,#f3f3f3);--_a:var(--pele-surface-alt,#e6e6e6);--_b:var(--pele-border,#8a8a8a);--_c:var(--pele-accent,#5b7bd5);color:var(--_fg);--_r:var(--pele-radius,4px);--_fm:var(--pele-font-mono,monospace);font:16px sans-serif;letter-spacing:normal;word-spacing:normal;text-transform:none;direction:ltr;font-family:var(--pele-font,ui-sans-serif, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Roboto, sans-serif)" fill="var(--_fg)" role="img" aria-roledescription="Flowchart diagram" aria-labelledby="pele-title" aria-describedby="pele-desc"><title id="pele-title">Deploy pipeline</title><desc id="pele-desc">A pull request is reviewed, then built, then released to production.</desc><g class="pele-edges" fill="none" stroke="var(--_l)" stroke-linecap="round"><g class="pele-edge" data-id="L_PR_Review_0"><path d="M129.68,32L170.68,32"></path><path class="pele-marker" d="M177.68,32L169.68,35.36L169.68,28.64Z" fill="var(--_l)" stroke="none"></path></g><g class="pele-edge" data-id="L_Review_Build_0"><path d="M265.16,32L306.16,32"></path><path class="pele-marker" d="M313.16,32L305.16,35.36L305.16,28.64Z" fill="var(--_l)" stroke="none"></path></g><g class="pele-edge" data-id="L_Build_Prod_0"><path d="M385.28,32L426.28,32"></path><path class="pele-marker" d="M433.28,32L425.28,35.36L425.28,28.64Z" fill="var(--_l)" stroke="none"></path></g></g><g class="pele-nodes"><g class="pele-node pele-shape-rect" data-id="PR" transform="translate(68.84,32)"><rect x="-60.84" y="-24" width="121.68" height="48" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"></rect><text